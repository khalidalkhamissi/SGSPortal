<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGS Forms — Coordination</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Themes.css?v=9">

<style>
/* ── الشريط البطل (Hero) — إنشاء نموذج ── */
.hero{
  position:relative;
  background:linear-gradient(120deg, var(--g) 0%, var(--gm) 55%, #00b377 100%);
  border-radius:18px; padding:28px 30px; margin-bottom:18px; overflow:hidden;
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:18px;
  box-shadow:0 12px 34px rgba(0,108,78,.28);
}
.hero::before{
  content:''; position:absolute; inset:0;
  background:
    radial-gradient(ellipse at 12% 120%, rgba(201,168,76,.28) 0%, transparent 50%),
    radial-gradient(ellipse at 95% -20%, rgba(255,255,255,.12) 0%, transparent 45%);
  pointer-events:none;
}
.hero-txt{ position:relative; z-index:1; color:#fff; }
.hero-eyebrow{
  display:inline-flex; align-items:center; gap:6px;
  font-size:11px; font-weight:700; letter-spacing:.4px;
  background:rgba(255,255,255,.16); color:#fff;
  padding:4px 11px; border-radius:20px; margin-bottom:10px; backdrop-filter:blur(4px);
}
.hero-title{ font-size:26px; font-weight:800; line-height:1.2; letter-spacing:-.4px; }
.hero-sub{ font-size:13px; opacity:.85; margin-top:6px; font-weight:300; max-width:520px; line-height:1.6; }
.hero-create{
  position:relative; z-index:1;
  display:inline-flex; align-items:center; gap:10px;
  padding:15px 28px; border:none; border-radius:14px;
  background:#fff; color:var(--g);
  font-family:'Tajawal',sans-serif; font-size:17px; font-weight:800; cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,.18); transition:transform .15s, box-shadow .15s; white-space:nowrap;
}
.hero-create:hover{ transform:translateY(-2px) scale(1.02); box-shadow:0 12px 30px rgba(0,0,0,.24); }
.hero-create:active{ transform:translateY(0) scale(1); }
.hero-create .plus{
  width:30px; height:30px; border-radius:50%;
  background:linear-gradient(135deg, var(--g), var(--gm)); color:#fff;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}

/* ── شريط الفلترة (نفس نمط drafts.html) ── */
.filter-bar{ display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; background:var(--w); border:1px solid var(--bd); border-radius:var(--r); padding:14px 16px; margin-bottom:14px; box-shadow:var(--sh); }
.fb-field{ display:flex; flex-direction:column; gap:5px; }
.fb-field label{ font-size:11px; font-weight:700; color:var(--mu); }
.fb-field input, .fb-field select{ padding:8px 12px; border:1.5px solid var(--bd); border-radius:9px; font-size:13px; font-family:'Tajawal',sans-serif; color:var(--tx); background:var(--w); outline:none; }
.fb-field input:focus, .fb-field select:focus{ border-color:var(--g); }
.fb-count{ margin-inline-start:auto; font-size:12px; font-weight:700; color:var(--mu); }

/* ── الجدول ── */
.flt-no{ font-family:'DM Mono',monospace; font-weight:700; color:var(--tx2); }
.bdg{ display:inline-flex; font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; white-space:nowrap; }
.s-draft{ background:var(--goldl); color:#9a7d2e; }
.s-done{  background:#DCFCE7;     color:#16A34A; }
.act-link{
  display:inline-flex; align-items:center; gap:5px; padding:5px 11px; border-radius:8px;
  border:1.5px solid var(--bd); background:var(--w); color:var(--mu); cursor:pointer;
  text-decoration:none; font-family:'Tajawal',sans-serif; font-size:11px; font-weight:700; transition:all .15s;
}
.act-link:hover{ background:var(--gl); color:var(--g); border-color:var(--g); }
.act-link.del:hover{ background:var(--redl); color:var(--red); border-color:var(--red); }
.empty{ padding:44px 20px; text-align:center; color:var(--mu); font-size:13px; }
.empty-icon{ font-size:34px; margin-bottom:10px; }

#toast{
  position:fixed; inset-inline-end:20px; bottom:20px; z-index:1100;
  background:var(--tx); color:#fff; padding:13px 18px; border-radius:12px;
  font-size:13px; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,.25);
  display:flex; align-items:center; gap:9px; transform:translateY(140%); opacity:0;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
}
#toast.show{ transform:translateY(0); opacity:1; }
</style>
</head>

<body>
<main class="main">

  <!-- ── الشريط العلوي ── -->
  <div class="topbar">
    <div class="topbar-l">
      <div class="pg-title" id="t-title">التنسيق</div>
      <div class="pg-sub"><span class="dot"></span><span id="t-sub">إنشاء نماذج التنسيق ومتابعتها</span></div>
    </div>
    <div class="topbar-r">
      <div class="ap-badge">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24">
          <path d="M21 16v-2l-8-5V3.5A1.5 1.5 0 0 0 11.5 2A1.5 1.5 0 0 0 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" fill="currentColor"/>
        </svg>
        <span id="t-station">—</span>
      </div>
    </div>
  </div>

  <!-- ── شريط البطل ── -->
  <div class="hero">
    <div class="hero-txt">
      <span class="hero-eyebrow">
        <svg width="12" height="12" fill="none" viewBox="0 0 24 24"><path d="M12 2l2.4 7.4H22l-6 4.5 2.3 7.1L12 16.6 5.7 21l2.3-7.1-6-4.5h7.6z" fill="currentColor"/></svg>
        <span id="h-eyebrow">نموذج جديد</span>
      </span>
      <div class="hero-title" id="h-title">نموذج التنسيق</div>
      <div class="hero-sub" id="h-sub">ابدأ نموذج تنسيق جديد (Coordination Sheet / Time Chart) لمتابعة أنشطة مناولة الرحلة وأوقاتها المخططة والفعلية.</div>
    </div>
    <button class="hero-create" onclick="goCreate()">
      <span class="plus"><svg width="16" height="16" fill="none" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></span>
      <span id="h-create">إنشاء نموذج</span>
    </button>
  </div>

  <!-- ── شريط الفلترة ── -->
  <div class="filter-bar">
    <div class="fb-field"><label id="fl-q">بحث</label><input type="search" class="sgs-q" id="flt-q" maxlength="50" oninput="onSearch()"></div>
    <div class="fb-field"><label id="fl-from">من</label><input type="date" id="flt-from" onchange="applyFilters()"></div>
    <div class="fb-field"><label id="fl-to">إلى</label><input type="date" id="flt-to" onchange="applyFilters()"></div>
    <div class="fb-field"><label id="fl-station">المطار</label><select id="flt-station" onchange="applyFilters()"></select></div>
    <div class="fb-field"><label id="fl-airline">شركة الطيران</label><select id="flt-airline" onchange="applyFilters()"></select></div>
    <div class="fb-field"><label id="fl-status">الحالة</label><select id="flt-status" onchange="applyFilters()"></select></div>
    <button class="btn-icon" onclick="clearFilters()" id="fl-clear">مسح الفلتر</button>
    <button class="btn-icon" onclick="exportExcel()" id="fl-xlsx">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="2"/><path d="M9 13l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="xlsx-l">تصدير Excel</span>
    </button>
    <span class="fb-count" id="fl-count"></span>
  </div>

  <div class="card">
    <div class="card-body-np">
      <div class="tbl-wrap">
        <table class="tbl">
          <thead>
            <tr>
              <th id="c-flight">رقم الرحلة</th>
              <th id="c-date">التاريخ</th>
              <th id="c-station">المطار</th>
              <th id="c-airline">شركة الطيران</th>
              <th id="c-status">الحالة</th>
              <th id="c-actions" style="text-align:center;">إجراءات</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="empty" id="empty" style="display:none;"><div class="empty-icon">🗂️</div><span id="empty-txt">لا توجد نماذج</span></div>
    </div>
  </div>

  <div class="pager" id="pager" style="display:none;"></div>

</main>

<div id="toast"></div>

<script src="nav.js?v=15"></script>
<script>
/* ════════════════════════════════════════════════
   صفحة التنسيق — الموطن الوحيد لنماذج Coordination
   لا تمر بدورة اعتماد: عرض وتعديل وحذف فقط.
   المصدر: GET /coordination (نفس عقد /reports)
════════════════════════════════════════════════ */

let lang = localStorage.getItem('lang') || 'en';
let page = 1, pageSize = SGS.pageSize, total = 0;
let ROWS = [], STATIONS = [], AIRLINES_LIST = [];

const T = {
  ar: {
    title:'التنسيق', sub:'إنشاء نماذج التنسيق ومتابعتها',
    eyebrow:'نموذج جديد', h_title:'نموذج التنسيق',
    h_sub:'ابدأ نموذج تنسيق جديد (Coordination Sheet / Time Chart) لمتابعة أنشطة مناولة الرحلة وأوقاتها المخططة والفعلية.',
    create:'إنشاء نموذج',
    fl_from:'من', fl_to:'إلى', fl_station:'المطار', fl_airline:'شركة الطيران', fl_status:'الحالة',
    fl_clear:'مسح الفلتر', all:'كل المطارات', all_air:'كل الشركات', all_st:'كل الحالات', count:'النتائج',
    c_flight:'رقم الرحلة', c_date:'التاريخ', c_station:'المطار', c_airline:'شركة الطيران',
    c_status:'الحالة', c_actions:'إجراءات',
    st_draft:'مسودة', st_done:'مكتمل',
    view:'عرض', edit:'تعديل', del:'حذف',
    empty:'لا توجد نماذج مطابقة',
    confirm_del:'هل تريد حذف هذا النموذج نهائياً؟', deleted:'تم حذف النموذج', del_err:'تعذّر الحذف',
  },
  en: {
    title:'Coordination', sub:'Create and track coordination sheets',
    eyebrow:'New Sheet', h_title:'Coordination Sheet',
    h_sub:'Start a new Coordination Sheet / Time Chart to track flight handling activities and their planned versus actual times.',
    create:'Create Sheet',
    fl_from:'From', fl_to:'To', fl_station:'Airport', fl_airline:'Airline', fl_status:'Status',
    fl_clear:'Clear', all:'All airports', all_air:'All airlines', all_st:'All statuses', count:'Results',
    c_flight:'Flight No.', c_date:'Date', c_station:'Airport', c_airline:'Airline',
    c_status:'Status', c_actions:'Actions',
    st_draft:'Draft', st_done:'Completed',
    view:'View', edit:'Edit', del:'Delete',
    empty:'No matching sheets',
    confirm_del:'Permanently delete this sheet?', deleted:'Sheet deleted', del_err:'Delete failed',
  },
};

const AIRLINES = { SV:'السعودية (SV)', XY:'طيران ناس (XY)', F3:'flyadeal (F3)', KU:'الكويتية (KU)' };
function airlineFromFlight(f){ const c = SGS.airlineCode(f); return c ? (AIRLINES[c] || c) : '—'; }


async function apiGet(path){
  const res = await fetch(`${SGS.API}${path}`, { headers: SGS.H() });
  if (res.status === 401) { localStorage.clear(); location.href='index.html'; return null; }
  return res.ok ? res.json() : null;
}

/* ── بناء سلسلة الاستعلام من الفلاتر ── */
function buildQuery(extra){
  const from = document.getElementById('flt-from').value;
  const to   = document.getElementById('flt-to').value;
  const code = document.getElementById('flt-station').value;
  const air  = document.getElementById('flt-airline').value;
  const st   = document.getElementById('flt-status').value;
  const stn  = STATIONS.find(s => s.code === code);
  const qs = new URLSearchParams();
  if (st)   qs.set('status', st);
  if (from) qs.set('from', from);
  if (to)   qs.set('to', to);
  if (stn)  qs.set('stationId', stn.id);
  if (air)  qs.set('airline', air);
  const q = document.getElementById('flt-q').value.trim();
  if (q) qs.set('q', q);
  for (const [k,v] of Object.entries(extra || {})) qs.set(k, v);
  return qs;
}

async function load(){
  const data = await apiGet('/coordination?' + buildQuery({ page, pageSize }).toString()) || {};
  ROWS = data.items || [];
  total = data.total || 0;
  AIRLINES_LIST = data.airlines || [];
  fillAirlines();
  render();
}

const onSearch = SGS.debounce(() => applyFilters());
function applyFilters(){ page = 1; load(); }
function clearFilters(){
  ['flt-from','flt-to','flt-station','flt-airline','flt-status','flt-q'].forEach(id => document.getElementById(id).value='');
  page = 1; load();
}

function fillStations(){
  const t = T[lang], cur = document.getElementById('flt-station').value;
  document.getElementById('flt-station').innerHTML =
    `<option value="">${t.all}</option>` +
    STATIONS.map(s => `<option value="${esc(s.code)}">${esc(s.code)} — ${esc(lang==='ar'?s.nameAr:s.nameEn)}</option>`).join('');
  document.getElementById('flt-station').value = cur;
}
function fillAirlines(){
  const t = T[lang], cur = document.getElementById('flt-airline').value;
  document.getElementById('flt-airline').innerHTML =
    `<option value="">${t.all_air}</option>` +
    AIRLINES_LIST.map(c => `<option value="${esc(c)}">${esc(AIRLINES[c] || c)}</option>`).join('');
  document.getElementById('flt-airline').value = cur;
}
function fillStatuses(){
  const t = T[lang], cur = document.getElementById('flt-status').value;
  document.getElementById('flt-status').innerHTML =
    `<option value="">${t.all_st}</option><option value="draft">${t.st_draft}</option><option value="submitted">${t.st_done}</option>`;
  document.getElementById('flt-status').value = cur;
}

function render(){
  const t = T[lang];
  document.getElementById('fl-count').textContent = `${t.count}: ${total}`;
  const tbody = document.getElementById('rows');

  if (!ROWS.length){
    tbody.innerHTML = '';
    document.getElementById('empty').style.display = 'block';
  } else {
    document.getElementById('empty').style.display = 'none';
    tbody.innerHTML = ROWS.map(r => {
      // لا اعتماد هنا: الحالة إما مسودة أو مكتمل
      const done = r.status !== 'draft';
      return `<tr>
        <td class="flt-no">${esc(r.flightNo || '—')}</td>
        <td>${esc(r.flightDate)}</td>
        <td>${esc(r.stationCode)}</td>
        <td>${esc(airlineFromFlight(r.flightNo))}</td>
        <td><span class="bdg ${done ? 's-done' : 's-draft'}">${done ? t.st_done : t.st_draft}</span></td>
        <td style="text-align:center;white-space:nowrap;">
          <a class="act-link" href="coordination_view.html?id=${encodeURIComponent(r.id)}">
            <svg width="12" height="12" fill="none" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/></svg>
            ${t.view}</a>
          ${SGS.can('coordination.create') ? `<a class="act-link" href="coordination_form.html?id=${encodeURIComponent(r.id)}">
            <svg width="12" height="12" fill="none" viewBox="0 0 24 24"><path d="M12 20h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
            ${t.edit}</a>` : ''}
          ${SGS.can('coordination.delete') ? `<a class="act-link del" href="javascript:void(0)" onclick="del(${Number(r.id)})">
            <svg width="12" height="12" fill="none" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            ${t.del}</a>` : ''}
        </td>
      </tr>`;
    }).join('');
  }

  SGS.pager('pager', page, total, pageSize, p => { page = p; load(); });
}

function exportExcel(){
  // نافذة اختيار ما يُصدَّر، تبدأ بقيم الفلتر الحالية
  SGS.exportExcel({
    type: 'coordination',
    status: document.getElementById('flt-status').value,
    stations: STATIONS, airlines: AIRLINES_LIST, airlineNames: AIRLINES,
    from: document.getElementById('flt-from').value, to: document.getElementById('flt-to').value,
    stationCode: document.getElementById('flt-station').value, airline: document.getElementById('flt-airline').value,
    q: document.getElementById('flt-q').value.trim(),
  });
}

function goCreate(){ location.href = 'coordination_form.html'; }

async function del(id){
  const t = T[lang];
  if (!confirm(t.confirm_del)) return;
  const res = await fetch(`${SGS.API}/coordination/${id}`, { method:'DELETE', headers: SGS.H() });
  if (res.status === 401) { localStorage.clear(); location.href='index.html'; return; }
  if (!res.ok) { toast(t.del_err); return; }
  toast(t.deleted);
  await load();
}

let toastTimer;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2600); }

/* ── تطبيق اللغة (يُستدعى من nav.js) ── */
function setLang(l){
  lang = l;
  const t = T[l];
  const set = (id,v)=>{ const e=document.getElementById(id); if(e) e.textContent=v; };
  set('t-title',t.title); set('t-sub',t.sub);
  set('h-eyebrow',t.eyebrow); set('h-title',t.h_title); set('h-sub',t.h_sub); set('h-create',t.create);
  set('fl-from',t.fl_from); set('fl-to',t.fl_to); set('fl-station',t.fl_station);
  set('fl-airline',t.fl_airline); set('fl-status',t.fl_status); set('fl-clear',t.fl_clear);
  set('xlsx-l', lang==='ar' ? 'تصدير Excel' : 'Export Excel');
  set('fl-q', lang==='ar' ? 'بحث' : 'Search'); document.getElementById('flt-q').placeholder = lang==='ar' ? 'رقم الرحلة، الوجهة، المطار…' : 'Flight, route, airport…';
  set('c-flight',t.c_flight); set('c-date',t.c_date); set('c-station',t.c_station);
  set('c-airline',t.c_airline); set('c-status',t.c_status); set('c-actions',t.c_actions);
  set('empty-txt',t.empty);
  fillStations(); fillAirlines(); fillStatuses();
  render();
}

document.addEventListener('DOMContentLoaded', async () => {
  if (!SGS.can('export.excel')) document.getElementById('fl-xlsx').style.display = 'none';
  document.getElementById('t-station').textContent = (window.SGS && SGS.airportName) ? SGS.airportName : '—';
  try { STATIONS = await apiGet('/stations') || []; } catch(e) { STATIONS = []; }
  fillStations(); fillStatuses();
  try { await load(); } catch(e) {}
  setLang(lang);
});
</script>
</body>
</html>
