<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGS Forms — المسودات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Themes.css?v=9">
<style>
.exp-pill{ font-family:'DM Mono',monospace; font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; }
.exp-ok{ background:var(--gl); color:var(--g); }
.exp-soon{ background:var(--orangel); color:var(--orange); }
.act-link{ display:inline-flex; align-items:center; gap:5px; padding:5px 11px; border-radius:8px; border:1.5px solid var(--bd); background:var(--w); color:var(--mu); cursor:pointer; text-decoration:none; font-family:'Tajawal',sans-serif; font-size:11px; font-weight:700; transition:all .15s; }
.act-link:hover{ background:var(--gl); color:var(--g); border-color:var(--g); }
.act-link.del:hover{ background:var(--redl); color:var(--red); border-color:var(--red); }
.flt-no{ font-family:'DM Mono',monospace; font-weight:700; color:var(--tx2); }
/* شريط الفلترة */
.filter-bar{ display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; background:var(--w); border:1px solid var(--bd); border-radius:var(--r); padding:14px 16px; margin-bottom:14px; box-shadow:var(--sh); }
.fb-field{ display:flex; flex-direction:column; gap:5px; }
.fb-field label{ font-size:11px; font-weight:700; color:var(--mu); }
.fb-field input, .fb-field select{ padding:8px 12px; border:1.5px solid var(--bd); border-radius:9px; font-size:13px; font-family:'Tajawal',sans-serif; color:var(--tx); background:var(--w); outline:none; }
.fb-field input:focus, .fb-field select:focus{ border-color:var(--g); }
.fb-count{ margin-inline-start:auto; font-size:12px; color:var(--mu); align-self:center; }
#toast{ position:fixed; inset-inline-end:20px; bottom:20px; z-index:1100; background:var(--tx); color:#fff; padding:13px 18px; border-radius:12px; font-size:13px; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,.25); transform:translateY(160%); opacity:0; transition:all .3s cubic-bezier(.34,1.56,.64,1); }
#toast.show{ transform:translateY(0); opacity:1; }
</style>
</head>
<body>
<main class="main">
  <div class="topbar">
    <div class="topbar-l">
      <div class="pg-title" id="t-title">المسودات</div>
      <div class="pg-sub" id="t-sub" style="color:var(--mu);">تقارير غير معتمدة — قابلة للتعديل والحذف</div>
    </div>
    <a class="btn-icon" href="main.html" id="t-back">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="t-back-l">رجوع للتقارير</span>
    </a>
  </div>

  <!-- شريط الفلترة -->
  <div class="filter-bar">
    <div class="fb-field"><label id="fl-q">بحث</label><input type="search" class="sgs-q" id="flt-q" maxlength="50" oninput="onSearch()"></div>
    <div class="fb-field"><label id="fl-from">من</label><input type="date" id="flt-from" onchange="applyFilters()"></div>
    <div class="fb-field"><label id="fl-to">إلى</label><input type="date" id="flt-to" onchange="applyFilters()"></div>
    <div class="fb-field"><label id="fl-station">المطار</label><select id="flt-station" onchange="applyFilters()"></select></div>
    <div class="fb-field"><label id="fl-airline">شركة الطيران</label><select id="flt-airline" onchange="applyFilters()"></select></div>
    <button class="btn-icon" onclick="clearFilters()" id="fl-clear">مسح الفلتر</button>
    <button class="btn-icon" onclick="exportExcel()" id="fl-xlsx">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="2"/><path d="M9 13l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="xlsx-l">تصدير Excel</span>
    </button>
    <span class="fb-count" id="fl-count"></span>
  </div>

  <div class="card">
    <div class="card-body-np">
      <div class="tbl-wrap">
        <table class="tbl">
          <thead>
            <tr>
              <th id="c-flight">رقم الرحلة</th>
              <th id="c-date">التاريخ</th>
              <th id="c-station">المطار</th>
              <th id="c-airline">شركة الطيران</th>
              <th id="c-exp">يُعتمد خلال</th>
              <th id="c-actions" style="text-align:center;">إجراءات</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="empty" id="empty" style="display:none;"><div class="empty-icon">📝</div><span id="empty-txt">لا توجد مسودات</span></div>
    </div>
  </div>

  <div class="pager" id="pager" style="display:none;"></div>
</main>

<div id="toast"></div>

<script src="nav.js?v=15"></script>
<script>
let lang = localStorage.getItem('lang') || 'en';
const T = {
  ar:{ title:'المسودات', sub:'تقارير غير معتمدة — قابلة للتعديل والحذف', back:'رجوع للتقارير',
       c_flight:'رقم الرحلة', c_date:'التاريخ', c_station:'المطار', c_airline:'شركة الطيران', c_exp:'يُعتمد خلال', c_actions:'إجراءات',
       edit:'تعديل', del:'حذف', empty:'لا توجد مسودات مطابقة', hrs:'س متبقية',
       fl_from:'من', fl_to:'إلى', fl_station:'المطار', fl_airline:'شركة الطيران', fl_clear:'مسح الفلتر', all:'كل المطارات', all_air:'كل الشركات', count:'النتائج',
       confirm_del:'هل تريد حذف هذه المسودة نهائياً؟', deleted:'تم حذف المسودة', del_err:'تعذّر الحذف' },
  en:{ title:'Drafts', sub:'Unapproved reports — editable and deletable', back:'Back to Reports',
       c_flight:'Flight No', c_date:'Date', c_station:'Airport', c_airline:'Airline', c_exp:'Expires in', c_actions:'Actions',
       edit:'Edit', del:'Delete', empty:'No matching drafts', hrs:'h left',
       fl_from:'From', fl_to:'To', fl_station:'Airport', fl_airline:'Airline', fl_clear:'Clear', all:'All airports', all_air:'All airlines', count:'Results',
       confirm_del:'Permanently delete this draft?', deleted:'Draft deleted', del_err:'Delete failed' },
};
const AIRLINES = { SV:'السعودية (SV)', XY:'طيران ناس (XY)', F3:'flyadeal (F3)' };
function airlineFromFlight(flt){ const c = SGS.airlineCode(flt); return c ? (AIRLINES[c] || c) : '—'; }

const STATUS = 'draft';
let DRAFTS = [], STATIONS = [], AIRLINES_LIST = [];
let page = 1, pageSize = SGS.pageSize, total = 0;

async function apiGet(path){
  const res = await fetch(`${SGS.API}${path}`, { headers: SGS.H() });
  if (res.status === 401) { localStorage.clear(); location.href='index.html'; return null; }
  return res.ok ? res.json() : [];
}
function buildQuery(extra){
  const from = document.getElementById('flt-from').value;
  const to = document.getElementById('flt-to').value;
  const code = document.getElementById('flt-station').value;
  const air = document.getElementById('flt-airline').value;
  const st = STATIONS.find(s => s.code === code);
  const qs = new URLSearchParams({ status: STATUS });
  if (from) qs.set('from', from);
  if (to) qs.set('to', to);
  if (st) qs.set('stationId', st.id);
  if (air) qs.set('airline', air);
  const q = document.getElementById('flt-q').value.trim();
  if (q) qs.set('q', q);
  if (extra) for (const k in extra) qs.set(k, extra[k]);
  return qs;
}
async function load(){
  const data = await apiGet('/reports?' + buildQuery({ page, pageSize }).toString()) || {};
  DRAFTS = data.items || [];
  total = data.total || 0;
  AIRLINES_LIST = data.airlines || [];
  fillAirlines();
  render();
}
const onSearch = SGS.debounce(() => applyFilters());
function applyFilters(){ page = 1; load(); }
function fillStations(){
  const t = T[lang];
  document.getElementById('flt-station').innerHTML =
    `<option value="">${t.all}</option>` + STATIONS.map(s => `<option value="${esc(s.code)}">${esc(s.code)} — ${esc(lang==='ar'?s.nameAr:s.nameEn)}</option>`).join('');
}
function fillAirlines(){
  const t = T[lang], cur = document.getElementById('flt-airline').value;
  document.getElementById('flt-airline').innerHTML = `<option value="">${t.all_air}</option>` + AIRLINES_LIST.map(c => `<option value="${esc(c)}">${esc(AIRLINES[c] || c)}</option>`).join('');
  document.getElementById('flt-airline').value = cur;
}

function render() {
  const t = T[lang];
  const rows = DRAFTS;
  document.getElementById('fl-count').textContent = `${t.count}: ${total}`;
  SGS.pager('pager', page, total, pageSize, p => { page = p; load(); });
  const tbody = document.getElementById('rows');
  if (!rows.length) { tbody.innerHTML=''; document.getElementById('empty').style.display='block'; return; }
  document.getElementById('empty').style.display='none';
  tbody.innerHTML = rows.map(r => {
    const kind = r.kind === 'departure' ? 'departure' : 'arrival', id = Number(r.id);
    const hrs = Number(r.hoursLeft) || 0;
    const expCls = hrs <= 6 ? 'exp-soon' : 'exp-ok';
    return `<tr>
      <td class="flt-no">${esc(r.flightNo)}</td>
      <td>${esc(r.flightDate)}</td>
      <td>${esc(r.stationCode)}</td>
      <td>${esc(airlineFromFlight(r.flightNo))}</td>
      <td><span class="exp-pill ${expCls}">${hrs} ${t.hrs}</span></td>
      <td style="text-align:center;white-space:nowrap;">
        ${SGS.can('reports.create') ? `<a class="act-link" href="report_form.html?dir=${kind}&id=${id}">
          <svg width="12" height="12" fill="none" viewBox="0 0 24 24"><path d="M12 20h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          ${t.edit}</a>` : ''}
        ${SGS.can('reports.delete') ? `<a class="act-link del" href="javascript:void(0)" onclick="del('${kind}',${id})">
          <svg width="12" height="12" fill="none" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          ${t.del}</a>` : ''}
      </td>
    </tr>`;
  }).join('');
}

async function del(kind, id) {
  const t = T[lang];
  if (!confirm(t.confirm_del)) return;
  try {
    const res = await fetch(`${SGS.API}/${kind}/${id}`, { method:'DELETE', headers: SGS.H() });
    if (res.status === 401) { localStorage.clear(); location.href='index.html'; return; }
    if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.detail || t.del_err); }
    await load(); toast(t.deleted);
  } catch (e) { toast(e.message); }
}

let toastTimer;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2600); }
function clearFilters(){ ['flt-from','flt-to','flt-station','flt-airline','flt-q'].forEach(id => document.getElementById(id).value=''); page = 1; load(); }

function exportExcel(){
  // يفتح نافذة الاختيار بقيم الفلتر الحالية؛ التنزيل يتم من داخلها
  SGS.exportExcel({
    status: STATUS, stations: STATIONS, airlines: AIRLINES_LIST, airlineNames: AIRLINES,
    from: document.getElementById('flt-from').value, to: document.getElementById('flt-to').value,
    stationCode: document.getElementById('flt-station').value, airline: document.getElementById('flt-airline').value,
    q: document.getElementById('flt-q').value.trim(),
  });
}

function setLang(l){
  lang=l; const t=T[l];
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  set('t-title',t.title); set('t-sub',t.sub); set('t-back-l',t.back);
  set('c-flight',t.c_flight); set('c-date',t.c_date); set('c-station',t.c_station);
  set('c-airline',t.c_airline); set('c-exp',t.c_exp); set('c-actions',t.c_actions);
  set('empty-txt',t.empty); set('fl-from',t.fl_from); set('fl-to',t.fl_to); set('fl-station',t.fl_station); set('fl-airline',t.fl_airline); set('fl-clear',t.fl_clear);
  set('fl-q', lang==='ar' ? 'بحث' : 'Search'); document.getElementById('flt-q').placeholder = lang==='ar' ? 'رقم الرحلة، الوجهة، المطار…' : 'Flight, route, airport…';
  set('xlsx-l', lang==='ar'?'تصدير Excel':'Export Excel');
  fillStations(); fillAirlines();
  render();
}
document.addEventListener('DOMContentLoaded', async () => {
  if (!SGS.can('export.excel')) document.getElementById('fl-xlsx').style.display = 'none';
  try { STATIONS = (await apiGet('/stations')) || []; await load(); } catch(e) { DRAFTS = []; }
  setLang(lang);
});
</script>
</body>
</html>
